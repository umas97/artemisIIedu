<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artemis II – Simulatore didattico</title>
    <meta name="description" content="Simulatore didattico della missione Artemis II per lo studio della meccanica orbitale" />
  </head>
  <body style="background: #04060b; margin: 0;">
    <div id="app"></div>
    
    <!-- Schermata di Caricamento Iniziale -->
    <div id="initial-loader" style="position: fixed; inset: 0; background: #04060b; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease;">
      <div style="width: 60px; height: 60px; border: 3px solid rgba(138, 184, 255, 0.2); border-top-color: #8ab8ff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <div style="margin-top: 20px; color: #8ab8ff; font-family: ui-monospace, Consolas, monospace; letter-spacing: 2px; font-size: 12px; font-weight: bold; text-transform: uppercase;">Inizializzazione Artemis...</div>
    </div>

    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
